[nosetests]
verbosity=2
attr=!manual
exclude=test_wildcard_performance
exe=1

[tool:pytest]
# importlib mode keeps the repository root out of sys.path, so the tests import
# the same package layout that an installed ``dxlclient`` has.
addopts = --import-mode=importlib -p no:cacheprovider
testpaths = dxlclient/test
