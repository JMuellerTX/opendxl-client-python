
name: Build

on:
  push:
    branches:
      - master
      - epo-legacy
  pull_request:
  workflow_dispatch:
  schedule:
    - cron:  '0 0 * * *'

jobs:
  build:

    # Two brokers, on purpose:
    #
    #   dockerhub - opendxl/opendxl-broker, last built in 2020: Debian stretch,
    #               OpenSSL 1.0.2, TLS 1.2 and AES128-SHA256 only. This is what
    #               people still run, so it stays the default axis.
    #   ghcr      - the maintained fork's broker (OpenSSL 4, TLS 1.3, PFS
    #               ciphers), published by the broker repository's own CI.
    #
    # The fork-broker TLS profiles (modern/legacy/pfsonly/trellix61) are
    # exercised in the broker repository's workflow, which starts all four at
    # once; here the point is only that the client still works against a current
    # broker on every supported Python version.
    #
    # Both axes are mandatory. The GHCR package was private when this matrix was
    # added (a package published by a workflow starts out private, and there is
    # no API to change that); it has been public since 2026-09-08 and the pull
    # works anonymously, so a red GHCR job now says something about the client.
    name: python ${{ matrix.python-version }} / ${{ matrix.broker.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        broker:
          - name: dockerhub
            image: opendxl/opendxl-broker
          - name: ghcr
            image: ghcr.io/jmuellertx/opendxl-broker:debian
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install broker
      # The two images differ in one thing that matters here: the fork's console
      # has no default password (it generates one per volume on first start),
      # while the 2021 Docker Hub image is fixed at admin/password and ignores
      # DXL_CONSOLE_PASSWORD. Supplying a password covers both - the old image
      # drops the variable on the floor, so it only has to be "password" there.
      run: |
        if [ "${{ matrix.broker.name }}" = "dockerhub" ]; then
          pw=password
        else
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
        fi
        echo "BROKER_PASSWORD=$pw" >> "$GITHUB_ENV"
        docker pull ${{ matrix.broker.image }}
        docker run -d -p 8883:8883 -p 8443:8443 -p 443:443 \
          -e DXL_CONSOLE_PASSWORD="$pw" ${{ matrix.broker.image }}
        docker ps -a

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install wheel
        pip install .[test]

    # `setup.py ci` ran pylint before the switch to pytest, and nothing replaced
    # it - lint regressions landed silently for as long as that was true.
    #
    # --errors-only on purpose. The full run scores 9.64/10 on a backlog that is
    # all style and Python-2-era distutils imports; gating on it would fail the
    # build today and teach everyone to ignore the step. The error class is what
    # actually breaks - undefined names, wrong arity, bad imports - and it passes,
    # so this is a gate that holds rather than one that is switched off.
    - name: Lint (errors only)
      run: |
        pylint --errors-only dxlclient *.py
        pylint --errors-only examples/*.py examples/**/*.py --rcfile .pylintrc.examples

    - name: Execute CI
      run: |
        # The CLI validates the management server's certificate by default; the
        # throwaway broker container uses a self-signed one, so skip validation here.
        python -m dxlclient provisionconfig dxlclient/test 127.0.0.1 client -u admin -p "$BROKER_PASSWORD" --insecure
        cp dxlclient/test/dxlclient.config dxlclient/test/client_config.cfg
        sed -i -e "s/127.0.0.1;127.0.0.1/127.0.0.1/g" -e "/local/d" -e "/docker/d" dxlclient/test/client_config.cfg
        # The open source broker only offers AES128-SHA256 for MQTT
        printf 'TlsCiphers = ECDHE+AESGCM:ECDHE+AES:DHE+AES:AES128-SHA256:!aNULL:!eNULL\n' >> dxlclient/test/client_config.cfg
        cat dxlclient/test/client_config.cfg
        echo Running tests with MQTT
        python -m pytest dxlclient/test
        sed -i -e "s/= False/= True/g" -e "s/;8883/;443/g" -e "s/Brokers/BrokersWebSockets/g" dxlclient/test/client_config.cfg
        cat dxlclient/test/client_config.cfg
        echo Running tests with WebSockets
        python -m pytest dxlclient/test
